name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh event data before deploy"
        type: boolean
        default: true
  push:
    branches: [main]
  schedule:
    # Full refresh: Tuesday/Thursday/Sunday 03:00 JST.
    - cron: "0 18 * * 1,3,6"
    # DOMMUNE refresh: daily 09:15, 15:15, and 21:15 JST.
    - cron: "15 0,6,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Backup currently published data
        continue-on-error: true
        run: |
          mkdir -p .fallback-data
          base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for file in events.json venues.json fetch-log.json fetch-errors.json; do
            curl --fail --silent --show-error --location "$base_url/$file" --output ".fallback-data/$file"
          done
      - name: Use currently published data
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_data)
        run: |
          if [ -f .fallback-data/events.json ] && [ -f .fallback-data/venues.json ]; then
            mkdir -p public/data
            cp .fallback-data/*.json public/data/
            echo "Using currently published data."
          else
            echo "::error::No currently published data is available. Run with refresh_data=true."
            exit 1
          fi
      - name: Fetch event data
        id: fetch_events
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        continue-on-error: true
        env:
          PREVIOUS_EVENTS_PATH: .fallback-data/events.json
          FETCH_REQUEST_DELAY_MS: 1000
          FETCH_MAX_RETRIES: 3
          FETCH_VENUE_IDS: ${{ github.event.schedule == '15 0,6,12 * * *' && 'dommune' || '' }}
        run: npm run fetch:events
      - name: Validate generated data
        id: validate_generated_data
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)) && steps.fetch_events.outcome == 'success'
        continue-on-error: true
        run: npm run validate:data
      - name: Restore previous data when refresh fails
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)) && (steps.fetch_events.outcome == 'failure' || steps.validate_generated_data.outcome == 'failure')
        run: |
          if [ -f .fallback-data/events.json ] && [ -f .fallback-data/venues.json ]; then
            mkdir -p public/data
            cp .fallback-data/*.json public/data/
            echo "Restored previously published data."
          else
            echo "::error::Event refresh failed and no previously published data is available."
            exit 1
          fi
      - name: Validate deploy data
        run: npm run validate:data
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
